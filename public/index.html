<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Virtual Whiteboard</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>

<div id="join-modal" class="modal-overlay">
  <div class="modal">
    <h1>Interactive Virtual Whiteboard</h1>
    <p>Enter a name to join the board</p>
    <input id="name-input" type="text" maxlength="40" placeholder="Your name" autocomplete="off" />
    <button id="join-btn">Join board</button>
  </div>
</div>

<div id="app" class="hidden">
  <header id="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" data-tool="select" title="Select / Move">Select</button>
      <button class="tool-btn" data-tool="rect" title="Rectangle">Rect</button>
      <button class="tool-btn" data-tool="ellipse" title="Ellipse">Ellipse</button>
      <button class="tool-btn" data-tool="line" title="Line">Line</button>
      <button class="tool-btn" data-tool="pen" title="Freehand Pen">Pen</button>
      <button class="tool-btn" data-tool="text" title="Text">Text</button>
      <button class="tool-btn" data-tool="sticky" title="Sticky Note">Sticky</button>
    </div>
    <div class="tool-group">
      <input id="color-input" type="color" value="#2a9d8f" title="Color" />
      <button id="delete-btn" title="Delete selected">Delete</button>
    </div>
    <div class="tool-group" id="presence-list"></div>
  </header>

  <div id="canvas-wrap">
    <canvas id="board-canvas"></canvas>
    <div id="cursor-layer"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
